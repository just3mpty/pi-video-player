# Raccourcis mpv, intégrés dans le binaire (include_str!) et passés via --input-conf.
# Les touches de mpv sont désactivées (--input-default-bindings=no) : chaque touche
# envoie un "script-message pvp <action>" que le programme Rust reçoit par l'IPC.
# En attendant que le bouton soit branché, le clavier et la souris le simulent.

# Rotation du bouton
UP          script-message pvp previous
LEFT        script-message pvp previous
WHEEL_UP    script-message pvp previous
DOWN        script-message pvp next
RIGHT       script-message pvp next
WHEEL_DOWN  script-message pvp next

# Clic du bouton
ENTER       script-message pvp select
KP_ENTER    script-message pvp select
SPACE       script-message pvp select
MBTN_LEFT   script-message pvp select

# Fermer le menu
ESC         script-message pvp back

# Pratique en dev : quitter
q           quit
CLOSE_WIN   quit
